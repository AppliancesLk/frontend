map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    # Allow the backend's 5 MiB image uploads plus multipart overhead.
    client_max_body_size 6m;

    # Docker's DNS lets the proxy recover when the backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        # NestJS routes do not have an /api prefix. Preserve the query string.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_read_timeout 120s;
    }

    # The existing chat client connects to /chat via the /socket.io transport.
    location /socket.io/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # React Router handles application routes, including direct page visits.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
