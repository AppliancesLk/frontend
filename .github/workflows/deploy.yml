name: Frontend CI and Deploy

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # =========================================================
  # QUALITY GATE
  # =========================================================
  quality:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      # Runs Vitest tests AND generates coverage
      - name: Run unit and component tests with coverage
        run: npm run test:coverage

      # Existing standalone Node test suites
      - name: Run catalog tests
        run: npm run test:catalog

      - name: Run checkout tests
        run: npm run test:checkout

      - name: Run cart tests
        run: npm run test:cart

      - name: Run auth tests
        run: npm run test:auth

      - name: Run product details tests
        run: npm run test:products

      - name: Run product edit tests
        run: npm run test:product-edit

      - name: Run theme tests
        run: npm run test:themes

      - name: Build frontend
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.sha }}
          path: coverage/
          retention-days: 14
          if-no-files-found: error


  # =========================================================
  # BUILD + DEPLOY
  # =========================================================
  build-and-deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    needs: quality

    # Never deploy a pull request.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: applianceslkdevacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            -t applianceslkdevacr.azurecr.io/frontend-app:${{ github.sha }} \
            -t applianceslkdevacr.azurecr.io/frontend-app:dev \
            .

      - name: Push frontend image
        run: |
          docker push applianceslkdevacr.azurecr.io/frontend-app:${{ github.sha }}
          docker push applianceslkdevacr.azurecr.io/frontend-app:dev

      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy frontend to Azure Container Apps
        run: |
          az containerapp update \
            --resource-group rg-appliances-dev \
            --name appliances-web-dev \
            --image applianceslkdevacr.azurecr.io/frontend-app:${{ github.sha }}

      - name: Show deployed image
        run: |
          az containerapp show \
            --resource-group rg-appliances-dev \
            --name appliances-web-dev \
            --query "properties.template.containers[0].image" \
            --output tsv