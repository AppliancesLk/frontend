<!doctype html>
<html lang="en-LK">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="preload"
      href="/fonts/instrument-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var theme = localStorage.getItem('al-theme');
        if (theme === 'light' || theme === 'dark')
          document.documentElement.dataset.theme = theme;
      } catch (e) {
        /* Use the system theme when storage is unavailable. */
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0A6B70" />
    <meta
      name="description"
      content="Explore home appliances and everyday technology at Appliances.lk. Shop products, track orders, and request repairs."
    />
    <title>Appliances.lk — Appliances &amp; Everyday Technology</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
